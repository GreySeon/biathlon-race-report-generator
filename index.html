<!DOCTYPE html>
<html lang="uk-UA">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width">
        <link rel="icon" href="icon.jpg" type="image/x-icon" />
        <title>Biathlon Race Report Generator</title>
        <meta
            name="description"
            content="A simple web-based biathlon results formatter with customizable race templates and athlete selection." />
        <link rel="stylesheet" href="style.css" />
        <script src="AthleteResultRow.js" defer></script>
        <script src="script.js" defer></script>
    </head>
    <body>
        <main>
            <p>
                <label for="competition">Змагання:</label>
                <select name="competition" id="competition">
                    <option value=""></option>
                    <option value="world_cup">Кубок Світу</option>
                    <option value="ibu_cup">Кубок IBU</option>
                </select>
            </p>
            <p>
                <label for="venue">Етап:</label>
                <select name="venue" id="venue"></select>
            </p>
            <p>
                <label for="gender">Гендер:</label>
                <select name="gender" id="gender">
                    <option value=""></option>
                    <option value="men">Чоловіки</option>
                    <option value="women">Жінки</option>
                </select>
            </p>
            <p>
                <label for="race">Гонка:</label>
                <select name="race" id="race">
                    <option value=""></option>
                    <optgroup label="Особисті гонки">
                        <option value="individual">Індивідуальна</option>
                        <option value="sprint">Спринт</option>
                        <option value="pursuit">Переслідування</option>
                        <option value="masstart">Масстарт</option>
                    </optgroup>
                    <optgroup label="Естафети">
                        <option value="classic">Класична</option>
                        <option value="mixed">Змішана</option>
                        <option value="single">Одиночна</option>
                    </optgroup>
                    <optgroup label="Інші гонки">
                        <option value="short">Коротка Індивідуальна</option>
                        <option value="masstart60">Масстарт-60</option>
                    </optgroup>
                </select>
            </p>
            <p>
                <label for="place_1_athlete">1 місце: </label>
                <input type="text" id="place_1_athlete" list="athlete_options_1" />
                <datalist id="athlete_options_1"></datalist>
                <input type="text" inputmode="numeric" maxlength="1" size="1" value="0" id="place_1_shot_1" />
                <input type="text" inputmode="numeric" maxlength="1" size="1" value="0" id="place_1_shot_2" />
                <input type="text" inputmode="numeric" maxlength="1" size="1" value="0" id="place_1_shot_3" />
                <input type="text" inputmode="numeric" maxlength="1" size="1" value="0" id="place_1_shot_4" />
                <label for="place_1_time_min" id="winner_time_label">Час:</label>
                <input type="text" inputmode="numeric" maxlength="2" size="1" value="0" id="place_1_time_min" />
                <label for="place_1_time_sec">:</label>
                <input type="text" inputmode="numeric" maxlength="2" size="1" value="0" id="place_1_time_sec" />
                <label for="place_1_time_ms">.</label>
                <input type="text" inputmode="numeric" maxlength="1" size="1" value="0" id="place_1_time_ms" />
            </p>
            <p>
                <label for="place_2_athlete">2 місце: </label>
                <input type="text" id="place_2_athlete" list="athlete_options_2" />
                <datalist id="athlete_options_2"></datalist>
                <input type="text" inputmode="numeric" maxlength="1" size="1" value="0" id="place_2_shot_1" />
                <input type="text" inputmode="numeric" maxlength="1" size="1" value="0" id="place_2_shot_2" />
                <input type="text" inputmode="numeric" maxlength="1" size="1" value="0" id="place_2_shot_3" />
                <input type="text" inputmode="numeric" maxlength="1" size="1" value="0" id="place_2_shot_4" />
                <label for="place_2_time_min">+</label>
                <input type="text" inputmode="numeric" maxlength="2" size="1" value="0" id="place_2_time_min" />
                <label for="place_2_time_sec">:</label>
                <input type="text" inputmode="numeric" maxlength="2" size="1" value="0" id="place_2_time_sec" />
                <label for="place_2_time_ms">.</label>
                <input type="text" inputmode="numeric" maxlength="1" size="1" value="0" id="place_2_time_ms" />
            </p>
            <p>
                <label for="place_3_athlete">3 місце: </label>
                <input type="text" id="place_3_athlete" list="athlete_options_3" />
                <datalist id="athlete_options_3"></datalist>
                <input type="text" inputmode="numeric" maxlength="1" size="1" value="0" id="place_3_shot_1" />
                <input type="text" inputmode="numeric" maxlength="1" size="1" value="0" id="place_3_shot_2" />
                <input type="text" inputmode="numeric" maxlength="1" size="1" value="0" id="place_3_shot_3" />
                <input type="text" inputmode="numeric" maxlength="1" size="1" value="0" id="place_3_shot_4" />
                <label for="place_3_time_min">+</label>
                <input type="text" inputmode="numeric" maxlength="2" size="1" value="0" id="place_3_time_min" />
                <label for="place_3_time_sec">:</label>
                <input type="text" inputmode="numeric" maxlength="2" size="1" value="0" id="place_3_time_sec" />
                <label for="place_3_time_ms">.</label>
                <input type="text" inputmode="numeric" maxlength="1" size="1" value="0" id="place_3_time_ms" />
            </p>
            <p>
                <label for="place_4_athlete">4 місце: </label>
                <input type="text" id="place_4_athlete" list="athlete_options_4" />
                <datalist id="athlete_options_4"></datalist>
                <input type="text" inputmode="numeric" maxlength="1" size="1" value="0" id="place_4_shot_1" />
                <input type="text" inputmode="numeric" maxlength="1" size="1" value="0" id="place_4_shot_2" />
                <input type="text" inputmode="numeric" maxlength="1" size="1" value="0" id="place_4_shot_3" />
                <input type="text" inputmode="numeric" maxlength="1" size="1" value="0" id="place_4_shot_4" />
                <label for="place_4_time_min">+</label>
                <input type="text" inputmode="numeric" maxlength="2" size="1" value="0" id="place_4_time_min" />
                <label for="place_4_time_sec">:</label>
                <input type="text" inputmode="numeric" maxlength="2" size="1" value="0" id="place_4_time_sec" />
                <label for="place_4_time_ms">.</label>
                <input type="text" inputmode="numeric" maxlength="1" size="1" value="0" id="place_4_time_ms" />
            </p>
            <p>
                <label for="place_5_athlete">5 місце: </label>
                <input type="text" id="place_5_athlete" list="athlete_options_5" />
                <datalist id="athlete_options_5"></datalist>
                <input type="text" inputmode="numeric" maxlength="1" size="1" value="0" id="place_5_shot_1" />
                <input type="text" inputmode="numeric" maxlength="1" size="1" value="0" id="place_5_shot_2" />
                <input type="text" inputmode="numeric" maxlength="1" size="1" value="0" id="place_5_shot_3" />
                <input type="text" inputmode="numeric" maxlength="1" size="1" value="0" id="place_5_shot_4" />
                <label for="place_5_time_min">+</label>
                <input type="text" inputmode="numeric" maxlength="2" size="1" value="0" id="place_5_time_min" />
                <label for="place_5_time_sec">:</label>
                <input type="text" inputmode="numeric" maxlength="2" size="1" value="0" id="place_5_time_sec" />
                <label for="place_5_time_ms">.</label>
                <input type="text" inputmode="numeric" maxlength="1" size="1" value="0" id="place_5_time_ms" />
            </p>
            <p>
                <label for="place_6_athlete">6 місце: </label>
                <input type="text" id="place_6_athlete" list="athlete_options_6" />
                <datalist id="athlete_options_6"></datalist>
                <input type="text" inputmode="numeric" maxlength="1" size="1" value="0" id="place_6_shot_1" />
                <input type="text" inputmode="numeric" maxlength="1" size="1" value="0" id="place_6_shot_2" />
                <input type="text" inputmode="numeric" maxlength="1" size="1" value="0" id="place_6_shot_3" />
                <input type="text" inputmode="numeric" maxlength="1" size="1" value="0" id="place_6_shot_4" />
                <label for="place_6_time_min">+</label>
                <input type="text" inputmode="numeric" maxlength="2" size="1" value="0" id="place_6_time_min" />
                <label for="place_6_time_sec">:</label>
                <input type="text" inputmode="numeric" maxlength="2" size="1" value="0" id="place_6_time_sec" />
                <label for="place_6_time_ms">.</label>
                <input type="text" inputmode="numeric" maxlength="1" size="1" value="0" id="place_6_time_ms" />
            </p>
            <p>
                <textarea id="output" readonly></textarea>
            </p>
            <p>
                <button id="generate" type="button">Згенерувати текст</button>
            </p>
            <p>
                <input type="text" id="error_text" readonly>
            </p>
        </main>
    </body>
</html>
