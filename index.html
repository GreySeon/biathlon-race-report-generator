<!DOCTYPE html>
<html lang="uk-UA">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width">
        <link rel="icon" href="/icon.jpg" type="image/x-icon" />
        <title>Biathlon Race Report Generator</title>
        <meta
            name="description"
            content="A simple web-based biathlon results formatter 
            with customizable race templates and athlete selection." />
        <link rel="stylesheet" href="style.css" />
        <script src="script.js" defer></script>
    </head>
    <body>
        <main>
            <p>
                <label for="competition">Змагання:</label>
                <select name="competition" id="competition">
                    <option value="empty"></option>
                    <option value="world_cup">Кубок Світу</option>
                    <option value="ibu_cup">Кубок IBU</option>
                </select>
            </p>
            <p>
                <label for="venue">Етап:</label>
                <select name="venue" id="venue"></select>
            </p>
            <p>
                <label for="gender">Гендер:</label>
                <select name="gender" id="gender">
                    <option value="empty"></option>
                    <option value="men">Чоловіки</option>
                    <option value="women">Жінки</option>
                </select>
            </p>
            <p>
                <label for="race">Гонка:</label>
                <select name="race" id="race">
                    <option value="empty"></option>
                    <optgroup label="Особисті гонки">
                        <option value="individual">Індивідуальна</option>
                        <option value="sprint">Спринт</option>
                        <option value="pursuit">Переслідування</option>
                        <option value="masstart">Масстарт</option>
                    </optgroup>
                    <optgroup label="Естафети">
                        <option value="classic">Класична</option>
                        <option value="mixed">Змішана</option>
                        <option value="single">Одиночна</option>
                    </optgroup>
                    <optgroup label="Додаткові гонки">
                        <option value="short">Коротка Індивідуальна</option>
                        <option value="masstart60">Масстарт-60</option>
                    </optgroup>
                </select>
            </p>
            <p>
                <textarea id="output" readonly></textarea>
            </p>
            <p>
                <button id="generate" type="button">Згенерувати текст</button>
            </p>
        </main>
    </body>
</html>
