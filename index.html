<!DOCTYPE html>
<html lang="uk-UA">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width">
        <link rel="icon" href="/icon.jpg" type="image/x-icon" />
        <title>Biathlon Race Report Generator</title>
        <meta
            name="description"
            content="A simple web-based biathlon results formatter 
            with customizable race templates and athlete selection." />
        <link rel="stylesheet" href="style.css" />
        <script src="script.js" defer></script>
    </head>
    <body>
        <main>
            <p>
                <label for="competition">Змагання:</label>
                <select name="competition" id="competition">
                    <option value="empty"></option>
                    <option value="world_cup">Кубок Світу</option>
                    <option value="ibu_cup">Кубок IBU</option>
                </select>
            </p>
            <p>
                <label for="venue">Етап:</label>
                <select name="venue" id="venue"></select>
            </p>
            <p>
                <label for="gender">Гендер:</label>
                <select name="gender" id="gender">
                    <option value="empty"></option>
                    <option value="men">Чоловіки</option>
                    <option value="women">Жінки</option>
                </select>
            </p>
            <p>
                <label for="race">Гонка:</label>
                <select name="race" id="race">
                    <option value="empty"></option>
                    <optgroup label="Особисті гонки">
                        <option value="individual">Індивідуальна</option>
                        <option value="sprint">Спринт</option>
                        <option value="pursuit">Переслідування</option>
                        <option value="masstart">Масстарт</option>
                    </optgroup>
                    <optgroup label="Естафети">
                        <option value="classic">Класична</option>
                        <option value="mixed">Змішана</option>
                        <option value="single">Одиночна</option>
                    </optgroup>
                    <optgroup label="Інші гонки">
                        <option value="short">Коротка Індивідуальна</option>
                        <option value="masstart60">Масстарт-60</option>
                    </optgroup>
                </select>
            </p>
            <p>
                <label for="1stplace">1 місце: </label>
                <input type="text" name="1stplace" id="1stplace" list="biathletes1" />
                <datalist id="biathletes1"></datalist>
                <input type="text" inputmode="numeric" maxlength="1" size="1" value="0" id="1stshooting1" />
                <input type="text" inputmode="numeric" maxlength="1" size="1" value="0" id="2ndshooting1" />
                <input type="text" inputmode="numeric" maxlength="1" size="1" value="0" id="3rdshooting1" />
                <input type="text" inputmode="numeric" maxlength="1" size="1" value="0" id="4thshooting1" />
                <label for="winningsecs">Час:</label>
                <input type="text" inputmode="numeric" maxlength="2" size="1" value="0" id="winningmins" />
                <label for="winningsecs">:</label>
                <input type="text" inputmode="numeric" maxlength="2" size="1" value="0" id="winningsecs" />
                <label for="winningmils">.</label>
                <input type="text" inputmode="numeric" maxlength="1" size="1" value="0" id="winningmils" />
            </p>
            <p>
                <label for="2ndplace">2 місце: </label>
                <input type="text" name="2ndplace" id="2ndplace" list="biathletes2" />
                <datalist id="biathletes2"></datalist>
                <input type="text" inputmode="numeric" maxlength="1" size="1" value="0" id="1stshooting2" />
                <input type="text" inputmode="numeric" maxlength="1" size="1" value="0" id="2ndshooting2" />
                <input type="text" inputmode="numeric" maxlength="1" size="1" value="0" id="3rdshooting2" />
                <input type="text" inputmode="numeric" maxlength="1" size="1" value="0" id="4thshooting2" />
                <label for="winningsecs">+</label>
                <input type="text" inputmode="numeric" maxlength="2" size="1" value="0" id="minsbehind2" />
                <label for="winningsecs">:</label>
                <input type="text" inputmode="numeric" maxlength="2" size="1" value="0" id="secsbehind2" />
                <label for="winningmils">.</label>
                <input type="text" inputmode="numeric" maxlength="1" size="1" value="0" id="milsbehind2" />
            </p>
            <p>
                <label for="3rdplace">3 місце: </label>
                <input type="text" name="3rdplace" id="3rdplace" list="biathletes3" />
                <datalist id="biathletes3"></datalist>
                <input type="text" inputmode="numeric" maxlength="1" size="1" value="0" id="1stshooting3" />
                <input type="text" inputmode="numeric" maxlength="1" size="1" value="0" id="2ndshooting3" />
                <input type="text" inputmode="numeric" maxlength="1" size="1" value="0" id="3rdshooting3" />
                <input type="text" inputmode="numeric" maxlength="1" size="1" value="0" id="4thshooting3" />
                <label for="winningsecs">+</label>
                <input type="text" inputmode="numeric" maxlength="2" size="1" value="0" id="minsbehind3" />
                <label for="winningsecs">:</label>
                <input type="text" inputmode="numeric" maxlength="2" size="1" value="0" id="secsbehind3" />
                <label for="winningmils">.</label>
                <input type="text" inputmode="numeric" maxlength="1" size="1" value="0" id="milsbehind3" />
            </p>
            <p>
                <label for="4thplace">4 місце: </label>
                <input type="text" name="4thplace" id="4thplace" list="biathletes4" />
                <datalist id="biathletes4"></datalist>
                <input type="text" inputmode="numeric" maxlength="1" size="1" value="0" id="1stshooting4" />
                <input type="text" inputmode="numeric" maxlength="1" size="1" value="0" id="2ndshooting4" />
                <input type="text" inputmode="numeric" maxlength="1" size="1" value="0" id="3rdshooting4" />
                <input type="text" inputmode="numeric" maxlength="1" size="1" value="0" id="4thshooting4" />
                <label for="winningsecs">+</label>
                <input type="text" inputmode="numeric" maxlength="2" size="1" value="0" id="minsbehind4" />
                <label for="winningsecs">:</label>
                <input type="text" inputmode="numeric" maxlength="2" size="1" value="0" id="secsbehind4" />
                <label for="winningmils">.</label>
                <input type="text" inputmode="numeric" maxlength="1" size="1" value="0" id="milsbehind4" />
            </p>
            <p>
                <label for="5thplace">5 місце: </label>
                <input type="text" name="5thplace" id="5thplace" list="biathletes5" />
                <datalist id="biathletes5"></datalist>
                <input type="text" inputmode="numeric" maxlength="1" size="1" value="0" id="1stshooting5" />
                <input type="text" inputmode="numeric" maxlength="1" size="1" value="0" id="2ndshooting5" />
                <input type="text" inputmode="numeric" maxlength="1" size="1" value="0" id="3rdshooting5" />
                <input type="text" inputmode="numeric" maxlength="1" size="1" value="0" id="4thshooting5" />
                <label for="winningsecs">+</label>
                <input type="text" inputmode="numeric" maxlength="2" size="1" value="0" id="minsbehind5" />
                <label for="winningsecs">:</label>
                <input type="text" inputmode="numeric" maxlength="2" size="1" value="0" id="secsbehind5" />
                <label for="winningmils">.</label>
                <input type="text" inputmode="numeric" maxlength="1" size="1" value="0" id="milsbehind5" />
            </p>
            <p>
                <label for="6thplace">6 місце: </label>
                <input type="text" name="6thplace" id="6thplace" list="biathletes6" />
                <datalist id="biathletes6"></datalist>
                <input type="text" inputmode="numeric" maxlength="1" size="1" value="0" id="1stshooting6" />
                <input type="text" inputmode="numeric" maxlength="1" size="1" value="0" id="2ndshooting6" />
                <input type="text" inputmode="numeric" maxlength="1" size="1" value="0" id="3rdshooting6" />
                <input type="text" inputmode="numeric" maxlength="1" size="1" value="0" id="4thshooting6" />
                <label for="winningsecs">+</label>
                <input type="text" inputmode="numeric" maxlength="2" size="1" value="0" id="minsbehind6" />
                <label for="winningsecs">:</label>
                <input type="text" inputmode="numeric" maxlength="2" size="1" value="0" id="secsbehind6" />
                <label for="winningmils">.</label>
                <input type="text" inputmode="numeric" maxlength="1" size="1" value="0" id="milsbehind6" />
            </p>
            <p>
                <textarea id="output" readonly></textarea>
            </p>
            <p>
                <button id="generate" type="button">Згенерувати текст</button>
            </p>
            <p>
                <input type="text" id="errorText" readonly></label>
            </p>
        </main>
    </body>
</html>
